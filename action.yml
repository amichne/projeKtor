name: projeKtor
description: Project one provider-neutral agent-tooling source tree into one harness-native payload.

inputs:
  source:
    description: Provider-neutral marketplace repository to read, relative to the workspace or absolute.
    required: false
    default: .
  harness:
    description: Target harness. Must be exactly codex or github-copilot.
    required: true
  output:
    description: Generated payload directory. Defaults to a fresh directory under RUNNER_TEMP.
    required: false
    default: ""
  version:
    description: projeKtor release tag in vX.Y.Z form, or latest for the newest stable release.
    required: false
    default: latest
  token:
    description: Token with contents:read access to private action release assets.
    required: false
    default: ""

outputs:
  projection-path:
    description: Absolute path to the validated harness-native payload.
    value: ${{ steps.project.outputs.projection-path }}
  files:
    description: Number of files in the validated projection.
    value: ${{ steps.project.outputs.files }}
  version:
    description: Exact projeKtor release tag used for projection.
    value: ${{ steps.project.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Project source
      id: project
      shell: bash
      env:
        ACTION_API_URL: ${{ github.api_url }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_SERVER_URL: ${{ github.server_url }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_HARNESS: ${{ inputs.harness }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: "${GITHUB_ACTION_PATH}/.github/actions/project/run.sh"

branding:
  icon: layers
  color: blue
