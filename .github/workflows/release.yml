name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version component to increment.
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag and create draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF_NAME" == "main" ]] || {
              echo "::error::Release workflow_dispatch must run from main; got ${GITHUB_REF_NAME}."
              exit 1
            }
            latest="$(git tag --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
            latest="${latest:-v0.0.0}"
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "$RELEASE_TYPE" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v${major}.$((minor + 1)).0" ;;
              patch) tag="v${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::Unsupported release type: ${RELEASE_TYPE}"; exit 1 ;;
            esac
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "$tag"
            git push origin "$tag"
          else
            tag="$GITHUB_REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vX.Y.Z: ${tag}"
            exit 1
          }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "$tag" --generate-notes
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build verified release assets
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate source
        run: |
          set -euo pipefail
          ./gradlew check --no-daemon
          .github/scripts/test-dependency-versions.sh
          .github/scripts/test-distribution-identity.sh
          .github/scripts/test-release-asset-verifier.sh
          .github/scripts/test-release-workflow-contract.sh
          .github/scripts/test-repository-boundary.sh
          .github/scripts/test-source-projection-action.sh
          git diff --check

      - name: Build and verify distribution
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          distribution_name="$(sed -n 's/^distributionName=//p' gradle.properties)"
          ./gradlew :cli:distTar --no-daemon -PdistributionVersion="$RELEASE_TAG"
          mkdir -p dist
          asset="${distribution_name}-${RELEASE_TAG}.tar.gz"
          cp "cli/build/distributions/${distribution_name}.tar.gz" "dist/${asset}"
          (cd dist && sha256sum "$asset" > SHA256SUMS)
          .github/scripts/verify-release-assets.sh --release-dir dist --tag "$RELEASE_TAG"

          smoke_root="$(mktemp -d "${RUNNER_TEMP}/projector-smoke.XXXXXX")"
          tar -xzf "dist/${asset}" -C "$smoke_root"
          cli="${smoke_root}/${distribution_name}/bin/${distribution_name}"
          "$cli" --help
          "$cli" --version | grep -F "${distribution_name} version ${RELEASE_TAG}"
          "$cli" project \
            --source .github/fixtures/source-projection \
            --harness codex \
            --out "${smoke_root}/codex"
          "$cli" project \
            --source .github/fixtures/source-projection \
            --harness github-copilot \
            --out "${smoke_root}/github-copilot"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/verify-release-assets.sh --release-dir dist --tag "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/* --clobber
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --notes "${body}

          ---
          **Build:** [CI Run #${{ github.run_number }}](${run_url})"

  verify:
    name: Verify published release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify published state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/verify-release-state.sh \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repository "${{ github.repository }}"
